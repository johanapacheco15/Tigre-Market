<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Compras | Tigre Market</title>
    <link rel="stylesheet" href="compras.css">
    <script src="carrito.js" defer></script>
    <script type="module" src="compras.js"></script>
</head>     

<body>

<!-- ==========================================================
    1. ENCABEZADO PRINCIPAL
========================================================== -->

<header class="encabezado">

    <div class="contenedor-logo-titulo">

        <img src="img/logoencab1.jpg.jpeg"
             alt="Tigre blanco de Tigre Market"
             class="logo-tigre-encabezado">

        <div class="texto-encabezado">
            <h1>Tigre Market</h1>
            <p>Compra y vende entre estudiantes universitarios</p>
        </div>

    </div>

<!-- ==========================================================
    2. MENU DE NAVEGACION PARA ACCEDEER A DIFERENTES SECCIONES
=========================================================== -->

<button class="btn-hamburguesa" id="btn-hamburguesa" aria-label="Abrir menú">
        &#9776;
    </button>
    <nav class="menu-navegacion" id="menu-navegacion">
        <a href="">
            <img src="/frontend/iconos/inicio.png" alt=""> Inicio
         </a>

        <a href="/frontend/compras.html">
            <img src="/frontend/iconos/compras.png" alt=""> Compras
        </a>

        <a href="/frontend/carrito.html">
            <img src="/frontend/iconos/carrito.png" alt=""> Carrito
        </a>
    </nav>

</header>

<!-- ==========================================================
    3. CONTENIDO PRINCIPAL
========================================================== -->

<main class="contenedor">

    <h2>Productos disponibles</h2>
    <section class="barra-busqueda-filtros">

   <!-- ======================================================
      4. BARRA DE BÚSQUEDA Y FILTROS
    ====================================================== -->

       <div class="buscador">

    <input
        type="text"
        id="buscador-producto"
        placeholder="Busca mochilas, libros, calculadoras..."
    >

    <button type="button" id="boton-buscar">
        Buscar
    </button>
</div>

    <!-- ==================================================
        5. FILTROS DE PRODUCTOS
    ================================================== -->
        <section class="filtros">

            <div class="filtro">

                <label for="filtro-categoria">Categoría:</label>

                <select id="filtro-categoria">

                    <option value="todas">Todas</option>
                    <option value="mochilas">Mochilas</option>
                    <option value="libros">Libros</option>
                    <option value="calculadoras">Calculadoras</option>
                    <option value="papeleria">Papelería</option>
                    <option value="otros">Otros</option>

                </select>

            </div>

    <!-- ==================================================
        5. FILTRO PARA SELECCIONAR EL COLOR 
    ================================================== -->

            <div class="filtro">

                <label for="filtro-color">Color:</label>

                <select id="filtro-color">

                    <option value="todos">Todos</option>
                    <option value="negro">Negro</option>
                    <option value="blanco">Blanco</option>
                    <option value="azul">Azul</option>
                    <option value="rosa">Rosa</option>
                    <option value="rojo">Rojo</option>

                </select>

            </div>
    <!-- ==================================================
        6. FILTRO PARA SELECCIONAR EL PRESUPUESTO 
    ================================================== -->

            <div class="filtro">

                <label for="filtro-presupuesto">Precio máximo:</label>

                <input
                    type="number"
                    id="filtro-presupuesto"
                    min="0"
                    placeholder="Ej. 300"
                >

            </div>

    <!-- ==================================================
        6. BOTON PARA REESTABLECER LOS FILTROS 
    ================================================== -->

            <button type="button" id="limpiar-filtros">
                Limpiar
            </button>

        </section>

    </section>

        
<!-- ==================================================
    7. CATALOGO DE PRODUCTOS 
================================================== -->

<section class="catalogo" id="catalogo">

    <!-- Los productos se cargarán automáticamente desde Firestore -->

    <p id="mensaje-catalogo">Cargando productos...</p>

</section>

</main>

<!-- ==========================================================
    10. PIE DE PÁGINA
========================================================== -->

<footer>
    <p>© 2026 Tigre Market</p>
</footer>

<!-- ==========================================================
     CONFIGURACIÓN DE FIREBASE
========================================================== -->
    
<script type="module" src="./proteger-pagina.js"></script>

</body>
</html>
