<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Compras | Tigre Market</title>
    <link rel="stylesheet" href="compras.css">
    <script src="carrito.js" defer></script>
    <script src="compras.js" defer></script>
</head>

<body>

<header class="encabezado">

    <div class="contenedor-logo-titulo">

        <img src="img/logoencab1.jpg.jpeg"
             alt="Tigre blanco de Tigre Market"
             class="logo-tigre-encabezado">

        <div class="texto-encabezado">
            <h1>Tigre Market</h1>
            <p>Compra y vende entre estudiantes universitarios</p>
        </div>

    </div>

<nav>
    <a href="Pagina-de-inicio.html">
        <img src="iconos/inicio.png" alt="">
        Inicio
    </a>

    <a href="compras.html">
        <img src="iconos/compras.png" alt="">
        Compras
    </a>

    <a href="carrito.html">
        <img src="iconos/carrito.png" alt="">
        Carrito
    </a>
</nav>

</header>

<main class="contenedor">

    <h2>Productos disponibles</h2>
    <section class="barra-busqueda-filtros">

       <div class="buscador">

    <input
        type="text"
        id="buscador-producto"
        placeholder="Busca mochilas, libros, calculadoras..."
    >

    <button type="button" id="boton-buscar">
        Buscar
    </button>
</div>

        <section class="filtros">

            <div class="filtro">

                <label for="filtro-categoria">Categoría:</label>

                <select id="filtro-categoria">

                    <option value="todas">Todas</option>
                    <option value="mochilas">Mochilas</option>
                    <option value="libros">Libros</option>
                    <option value="calculadoras">Calculadoras</option>
                    <option value="papeleria">Papelería</option>
                    <option value="otros">Otros</option>

                </select>

            </div>

            <div class="filtro">

                <label for="filtro-color">Color:</label>

                <select id="filtro-color">

                    <option value="todos">Todos</option>
                    <option value="negro">Negro</option>
                    <option value="blanco">Blanco</option>
                    <option value="azul">Azul</option>
                    <option value="rosa">Rosa</option>
                    <option value="rojo">Rojo</option>

                </select>

            </div>

            <div class="filtro">

                <label for="filtro-presupuesto">Precio máximo:</label>

                <input
                    type="number"
                    id="filtro-presupuesto"
                    min="0"
                    placeholder="Ej. 300"
                >

            </div>

            <button type="button" id="limpiar-filtros">
                Limpiar
            </button>

        </section>

    </section>

    <section class="catalogo" id="catalogo">

        <article class="tarjeta-producto"
            data-categoria="mochilas"
            data-producto="mochila universitaria"
            data-color="negro"
            data-precio="180">

            <img src="mochila.jpg"
                 alt="Mochila universitaria"
                 class="foto-producto">

            <h3>Mochila universitaria</h3>

            <p>En buen estado, ideal para tus clases.</p>

            <p class="precio">$180 MXN</p>

            <button class="ver-producto"
                data-nombre="Mochila universitaria"
                data-descripcion="En buen estado, ideal para tus clases."
                data-precio="180">

                Ver producto

            </button>

            <button class="agregar"
                data-id="1"
                data-nombre="Mochila universitaria"
                data-precio="180"
                data-imagen="mochila.jpg">

                Agregar al carrito

            </button>

        </article>

        <article class="tarjeta-producto"
            data-categoria="calculadoras"
            data-producto="calculadora científica"
            data-color="negro"
            data-precio="250">

            <img src="calculadora.jpg"
                 alt="Calculadora científica"
                 class="foto-producto">

            <h3>Calculadora científica</h3>

            <p>Ideal para matemáticas y otras materias.</p>

            <p class="precio">$250 MXN</p>

            <button class="ver-producto"
                data-nombre="Calculadora científica"
                data-descripcion="Ideal para matemáticas y otras materias."
                data-precio="250">

                Ver producto

            </button>

            <button class="agregar"
                data-id="2"
                data-nombre="Calculadora científica"
                data-precio="250"
                data-imagen="calculadora.jpg">

                Agregar al carrito

            </button>

        </article>

    </section>

</main>

<footer>
    <p>© 2026 Tigre Market</p>
</footer>

</body>
</html>
