<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambio de Contraseña | Tigre Market</title>
    <link rel="stylesheet" href="cambio-contraseña.css">
    <script src="cambio-contraseña.js" defer></script>
</head>
<body>

    <!--==========================================
        1. CONTENEDOR PRINCIPAL 
    ==========================================-->

    <main class="contenedor">

    <!--================================================
        2. COLUMNA IZQUIERDA: IDENTIDAD DE LA PLATAFORMA
    =================================================-->

    <header class="container">
            <section class="text">
                <h1 class="title">Tiger Market</h1>
                <p class="subtitle">Compra y vende entre estudiantes universitarios</p>
            </section>
        </header>

      <!--================================================
        3. COLUMNA DERECHA: TARJETA DE RECUPERACION
      =================================================-->

      <section class="formulario">
            <h2>Cambio de contraseña</h2>
            <p>Ingresa tu correo electrónico institucional para continuar.</p>

      <!--================================================
        4. FORMULARIO 
      =================================================-->

            <form id="cambio-password-form">
                <label for="correo-login">Correo electrónico</label>

      <!--================================================
        5. CAMPO DE CORREO ELECTRÓNICO 
      =================================================-->

                <div class="input-container">
                    <input 
                        type="text" 
                        id="correo-login" 
                        name="correo" 
                        placeholder="ejemplo: juanita_23" 
                        autocomplete="off" 
                        pattern="[a-z0-9_]+" 
                        required
                    >
                    <span class="domain-fixed">@tecnaucalpan.mx</span>
                </div>

      <!--================================================
        6. BOTÓN PARA ENVIAR EL ENLACE 
      =================================================-->

                <button type="submit">Enviar enlace a tu correo electrónico</button>

      <!--================================================
        7.  ENLACE PARA REGRESAR AL LOGIN 
      =================================================-->

                <p class="nota">
                    ¿Recordaste tu contraseña? <a href="../index.html">Inicia sesión</a>
                </p>
            </form>
        </section>
    </main>
</body>
</html>
