<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/frontend/css/opciones-de-cuenta.css">
    <scrit src="/frontend/js/opciones-de-cuenta.js" defer></script>
</head>
<body>
<!-- Botón en el Header para abrir la cuenta -->
<button id="btn-abrir-cuenta" class="btn-perfil">
    <img src="/frontend/img/default-avatar.png" alt="Perfil" class="avatar-header">
    <span>Mi Cuenta</span>
</button>

<!-- Fondo oscuro (Overlay) -->
<div id="overlay-cuenta" class="overlay-cuenta"></div>

<!-- Menú desplegable lateral (Panel de Cuenta) -->
<aside id="panel-cuenta" class="panel-cuenta">
    <div class="panel-header">
        <h3>Opciones de Cuenta</h3>
        <button id="btn-cerrar-panel" class="btn-cerrar">&times;</button>
    </div>

    <!-- Información del Usuario -->
    <div class="perfil-info">
        <div class="avatar-container">
            <img src="/frontend/img/default-avatar.png" alt="Foto de Perfil" id="foto-perfil">
        </div>
        <h4 id="nombre-usuario">Usuario Tigre</h4>
        <span class="user-email">usuario@tigremarket.com</span>
    </div>

    <!-- Opciones del Menú -->
    <nav class="panel-menu">
        <button class="menu-item" onclick="location.href='/frontend/views/perfil.html'">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            Editar Perfil
        </button>

        <button class="menu-item" onclick="location.href='/frontend/views/cambio-password.html'">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            Cambiar Contraseña
        </button>

        <div class="menu-divider"></div>

        <button id="btn-logout" class="menu-item btn-logout">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            Cerrar Sesión
        </button>

        <button id="btn-eliminar-cuenta" class="menu-item btn-danger">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            Eliminar Cuenta
        </button>
    </nav>
</aside>
</body>
</html>
